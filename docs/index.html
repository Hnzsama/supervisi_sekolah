<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APSIKITA — Dokumentasi Spesifikasi & Workflow</title>
  
  <!-- Google Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- Marked parser & Highlight.js -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  
  <!-- Mermaid.js for Diagrams -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>

  <!-- Bundled Markdown Data -->
  <script src="docs_data.js"></script>

  <style>
    :root {
      --bg-main: #0b0f19;
      --bg-sidebar: #111827;
      --bg-card: #1e293b;
      --bg-input: #1e293b;
      --border-color: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --accent-primary: #38bdf8;
      --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
      --accent-glow: rgba(56, 189, 248, 0.15);
      --accent-active: #0284c7;
      --sidebar-width: 320px;
      --toc-width: 260px;
      --header-height: 64px;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-heading: 'Outfit', 'Inter', sans-serif;
      --font-mono: 'Fira Code', monospace;
    }

    [data-theme="light"] {
      --bg-main: #f8fafc;
      --bg-sidebar: #ffffff;
      --bg-card: #ffffff;
      --bg-input: #f1f5f9;
      --border-color: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #475569;
      --text-dim: #94a3b8;
      --accent-primary: #0284c7;
      --accent-gradient: linear-gradient(135deg, #0284c7 0%, #4f46e5 50%, #9333ea 100%);
      --accent-glow: rgba(2, 132, 199, 0.1);
      --accent-active: #0369a1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      line-height: 1.6;
    }

    /* Top Navbar */
    .header {
      height: var(--header-height);
      background: var(--bg-sidebar);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      z-index: 100;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      background: var(--accent-gradient);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-family: var(--font-heading);
      color: #fff;
      font-size: 1.2rem;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
    }

    .brand-text h1 {
      font-family: var(--font-heading);
      font-size: 1.15rem;
      font-weight: 700;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.02em;
    }

    .brand-text span {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .search-box {
      position: relative;
      width: 360px;
    }

    .search-input {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 0.5rem 1rem 0.5rem 2.5rem;
      color: var(--text-main);
      font-size: 0.875rem;
      outline: none;
      transition: all 0.2s;
    }

    .search-input:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .search-icon {
      position: absolute;
      left: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      fill: var(--text-muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .btn-icon {
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-icon:hover {
      background: var(--border-color);
      color: var(--accent-primary);
    }

    /* Main Container */
    .app-container {
      display: flex;
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    /* Sidebar Nav */
    .sidebar {
      width: var(--sidebar-width);
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow-y: auto;
    }

    .sidebar-section {
      padding: 1.25rem 1rem 0.5rem 1rem;
    }

    .section-title {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      margin-bottom: 0.5rem;
      padding-left: 0.5rem;
    }

    .doc-nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .doc-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.65rem 0.75rem;
      border-radius: 8px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 400;
      cursor: pointer;
      transition: all 0.15s ease;
      position: relative;
    }

    .doc-item:hover {
      background: var(--accent-glow);
      color: var(--text-main);
    }

    .doc-item.active {
      background: var(--accent-glow);
      color: var(--accent-primary);
      font-weight: 600;
      border-left: 3px solid var(--accent-primary);
    }

    .doc-num {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--text-dim);
      flex-shrink: 0;
    }

    .doc-item.active .doc-num {
      background: var(--accent-primary);
      color: #fff;
      border-color: transparent;
    }

    .doc-title-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    /* Content Area */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg-main);
    }

    .doc-toolbar {
      padding: 0.75rem 2rem;
      background: rgba(17, 24, 39, 0.6);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .breadcrumb-active {
      color: var(--text-main);
      font-weight: 600;
    }

    .doc-meta {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .meta-badge {
      font-size: 0.75rem;
      font-family: var(--font-mono);
      padding: 2px 8px;
      border-radius: 99px;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
    }

    .content-body-wrapper {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .markdown-container {
      flex: 1;
      overflow-y: auto;
      padding: 2.5rem 3rem;
      scroll-behavior: smooth;
    }

    .markdown-body {
      max-width: 960px;
      margin: 0 auto;
      font-size: 1rem;
      line-height: 1.75;
      color: var(--text-main);
    }

    /* Typography & Markdown Styling */
    .markdown-body h1 {
      font-family: var(--font-heading);
      font-size: 2.25rem;
      font-weight: 700;
      margin-top: 0;
      margin-bottom: 1.5rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border-color);
      letter-spacing: -0.02em;
    }

    .markdown-body h2 {
      font-family: var(--font-heading);
      font-size: 1.6rem;
      font-weight: 600;
      margin-top: 2rem;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border-color);
      color: var(--text-main);
    }

    .markdown-body h3 {
      font-family: var(--font-heading);
      font-size: 1.25rem;
      font-weight: 600;
      margin-top: 1.5rem;
      margin-bottom: 0.75rem;
      color: var(--accent-primary);
    }

    .markdown-body p {
      margin-bottom: 1.2rem;
      color: var(--text-main);
    }

    .markdown-body ul, .markdown-body ol {
      margin-bottom: 1.2rem;
      padding-left: 1.5rem;
    }

    .markdown-body li {
      margin-bottom: 0.4rem;
    }

    .markdown-body blockquote {
      border-left: 4px solid var(--accent-primary);
      padding: 0.8rem 1.2rem;
      background: var(--accent-glow);
      border-radius: 0 8px 8px 0;
      margin-bottom: 1.5rem;
      color: var(--text-main);
    }

    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 1.5rem;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .markdown-body th {
      background: var(--bg-card);
      font-weight: 600;
      text-align: left;
      padding: 0.75rem 1rem;
      border-bottom: 2px solid var(--border-color);
      color: var(--accent-primary);
    }

    .markdown-body td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border-color);
    }

    .markdown-body tr:last-child td {
      border-bottom: none;
    }

    .markdown-body tr:nth-child(even) {
      background: rgba(255, 255, 255, 0.015);
    }

    .markdown-body code {
      font-family: var(--font-mono);
      font-size: 0.875em;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-color);
      padding: 0.15em 0.4em;
      border-radius: 4px;
      color: #38bdf8;
    }

    .markdown-body pre {
      background: #141b2d !important;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
      overflow-x: auto;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .markdown-body pre code {
      background: none;
      border: none;
      padding: 0;
      color: inherit;
    }

    /* Mermaid Container Styling */
    .mermaid-wrapper {
      background: #0d1322;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.5rem;
      margin: 1.5rem 0;
      width: 100%;
      overflow-x: auto;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .mermaid {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .mermaid svg {
      max-width: 100% !important;
      height: auto !important;
    }

    .markdown-body hr {
      border: none;
      height: 1px;
      background: var(--border-color);
      margin: 2.5rem 0;
    }

    /* Right Table of Contents */
    .toc-sidebar {
      width: var(--toc-width);
      background: var(--bg-sidebar);
      border-left: 1px solid var(--border-color);
      padding: 1.5rem 1rem;
      overflow-y: auto;
      flex-shrink: 0;
    }

    .toc-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      margin-bottom: 1rem;
    }

    .toc-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .toc-item a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.8rem;
      display: block;
      line-height: 1.4;
      transition: color 0.15s;
    }

    .toc-item a:hover {
      color: var(--accent-primary);
    }

    .toc-item.depth-3 {
      padding-left: 0.75rem;
    }

    /* Modal Raw View */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .modal-card {
      width: 90%;
      max-width: 900px;
      height: 80vh;
      background: var(--bg-sidebar);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-body {
      flex: 1;
      padding: 1.5rem;
      overflow: auto;
    }

    .raw-textarea {
      width: 100%;
      height: 100%;
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-family: var(--font-mono);
      font-size: 0.875rem;
      padding: 1rem;
      resize: none;
      outline: none;
    }

    @media (max-width: 1024px) {
      .toc-sidebar {
        display: none;
      }
      .search-box {
        width: 220px;
      }
    }
  </style>
</head>
<body>

  <!-- Header Bar -->
  <header class="header">
    <div class="brand">
      <div class="brand-logo">A</div>
      <div class="brand-text">
        <h1>APSIKITA</h1>
        <span>Aplikasi Supervisi Kolaborasi dan Tindak Lanjut</span>
      </div>
    </div>

    <div class="search-box">
      <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input type="text" id="searchInput" class="search-input" placeholder="Cari di dokumentasi APSIKITA...">
    </div>

    <div class="header-actions">
      <button class="btn-icon" id="themeToggle" title="Toggle Light/Dark Theme">
        🌙
      </button>
      <button class="btn-icon" id="rawViewBtn" title="Lihat Raw Markdown">
        📄
      </button>
    </div>
  </header>

  <!-- Main Workspace -->
  <div class="app-container">
    
    <!-- Left Navigation Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-section">
        <div class="section-title">Dokumentasi Utama</div>
        <ul class="doc-nav-list" id="mainDocList"></ul>
      </div>

      <div class="sidebar-section">
        <div class="section-title">Context & Konteks Mentah</div>
        <ul class="doc-nav-list" id="contextDocList"></ul>
      </div>
    </aside>

    <!-- Main Content Viewer -->
    <main class="main-content">
      <div class="doc-toolbar">
        <div class="breadcrumb">
          <span>docs</span>
          <span>/</span>
          <span id="breadcrumbFileName" class="breadcrumb-active">01-gambaran-umum-produk.md</span>
        </div>
        <div class="doc-meta">
          <span class="meta-badge" id="lineCountBadge">0 Baris</span>
          <span class="meta-badge" id="fileSizeBadge">0 KB</span>
        </div>
      </div>

      <div class="content-body-wrapper">
        <div class="markdown-container" id="markdownContainer">
          <article class="markdown-body" id="markdownRender"></article>
        </div>

        <!-- Right Table of Contents -->
        <aside class="toc-sidebar">
          <div class="toc-title">Daftar Isi Dokumentasi</div>
          <ul class="toc-list" id="tocList"></ul>
        </aside>
      </div>
    </main>
  </div>

  <!-- Raw View Modal -->
  <div class="modal-overlay" id="rawModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modalTitle">Raw Markdown</h3>
        <button class="btn-icon" id="closeModal">✕</button>
      </div>
      <div class="modal-body">
        <textarea id="rawTextarea" class="raw-textarea" readonly></textarea>
      </div>
    </div>
  </div>

  <script>
    // Initialize Mermaid with balanced scaling
    mermaid.initialize({
      startOnLoad: false,
      theme: 'dark',
      securityLevel: 'loose',
      fontSize: 14,
      fontFamily: 'Inter, sans-serif',
      sequence: {
        actorFontSize: 14,
        noteFontSize: 13,
        messageFontSize: 13,
        boxTextFontSize: 14,
        useMaxWidth: true
      },
      flowchart: {
        useMaxWidth: true,
        htmlLabels: true,
        nodeSpacing: 35,
        rankSpacing: 35
      }
    });

    const docsData = window.DOCS_DATA || {};
    let currentDocKey = '01-gambaran-umum-produk.md';

    // Indonesian Display Title Mapping
    const docDisplayNames = {
      "README.md": "Panduan & Indeks Dokumentasi",
      "AGENT-CONTEXT.md": "Konteks & Aturan AI Agent",
      "01-gambaran-umum-produk.md": "Gambaran Umum Produk",
      "02-peran-dan-hak-akses.md": "Peran & Hak Akses",
      "03-alur-kerja-bisnis.md": "Alur Kerja Bisnis",
      "04-modul-fitur.md": "Modul Fitur Aplikasi",
      "05-model-domain-data.md": "Model Domain & Data",
      "06-integrasi-google-drive.md": "Direct Upload & Google Drive Integration",
      "07-sistem-ai-dan-verifikasi.md": "Sistem AI & Verifikasi",
      "08-sistem-observasi-kelas.md": "Sistem Observasi Kelas",
      "09-dashboard-dan-laporan.md": "Dashboard & Laporan Akhir",
      "10-panduan-implementasi.md": "Panduan Implementasi",
      "11-pertanyaan-terbuka.md": "Pertanyaan Terbuka & Asumsi",
      "12-glosarium.md": "Glosarium Istilah",
      "13-alur-pendaftaran-dan-invitasi-user.md": "Alur Pendaftaran & Invitasi User",
      "SUPERVISI_APP_MASTER_CONTEXT.md": "Catatan Master Client (Mentah)"
    };

    const orderList = [
      "README.md",
      "AGENT-CONTEXT.md",
      "01-gambaran-umum-produk.md",
      "02-peran-dan-hak-akses.md",
      "03-alur-kerja-bisnis.md",
      "04-modul-fitur.md",
      "05-model-domain-data.md",
      "06-integrasi-google-drive.md",
      "07-sistem-ai-dan-verifikasi.md",
      "08-sistem-observasi-kelas.md",
      "09-dashboard-dan-laporan.md",
      "10-panduan-implementasi.md",
      "11-pertanyaan-terbuka.md",
      "12-glosarium.md",
      "13-alur-pendaftaran-dan-invitasi-user.md",
      "SUPERVISI_APP_MASTER_CONTEXT.md"
    ];


    marked.setOptions({
      highlight: function(code, lang) {
        if (lang && hljs.getLanguage(lang)) {
          return hljs.highlight(code, { language: lang }).value;
        }
        return hljs.highlightAuto(code).value;
      },
      breaks: true
    });

    // Populate Sidebar Lists with Indonesian Titles
    function renderSidebar(filterQuery = '') {
      const mainList = document.getElementById('mainDocList');
      const contextList = document.getElementById('contextDocList');
      
      mainList.innerHTML = '';
      contextList.innerHTML = '';

      orderList.forEach(key => {
        if (!docsData[key]) return;

        const displayName = docDisplayNames[key] || key;
        if (filterQuery && !key.toLowerCase().includes(filterQuery.toLowerCase()) && !displayName.toLowerCase().includes(filterQuery.toLowerCase()) && !docsData[key].toLowerCase().includes(filterQuery.toLowerCase())) {
          return;
        }

        const isMaster = key.includes('MASTER_CONTEXT');
        const li = document.createElement('li');
        
        let numLabel = '';
        if (key === 'README.md') numLabel = 'IDX';
        else if (key === 'AGENT-CONTEXT.md') numLabel = 'CTX';
        else if (key.match(/^\d+/)) {
          numLabel = key.substring(0, 2);
        } else {
          numLabel = 'DOC';
        }

        li.className = `doc-item ${key === currentDocKey ? 'active' : ''}`;
        li.innerHTML = `
          <span class="doc-num">${numLabel}</span>
          <span class="doc-title-text">${displayName}</span>
        `;
        li.onclick = () => loadDocument(key);

        if (isMaster) {
          contextList.appendChild(li);
        } else {
          mainList.appendChild(li);
        }
      });
    }

    // Load Document Content
    async function loadDocument(key) {
      currentDocKey = key;
      const content = docsData[key] || '# Dokumen Tidak Ditemukan';

      // Update Toolbar & Metadata
      document.getElementById('breadcrumbFileName').textContent = docDisplayNames[key] || key;
      const lines = content.split('\n').length;
      const bytes = new Blob([content]).size;
      document.getElementById('lineCountBadge').textContent = `${lines} Baris`;
      document.getElementById('fileSizeBadge').textContent = `${(bytes / 1024).toFixed(1)} KB`;

      // Render Markdown
      const html = marked.parse(content);
      const renderElem = document.getElementById('markdownRender');
      renderElem.innerHTML = html;

      // Transform Mermaid Code Blocks into Renderable Divs
      const codeBlocks = renderElem.querySelectorAll('pre code.language-mermaid, pre code.lang-mermaid, pre code');
      codeBlocks.forEach((codeBlock) => {
        const text = codeBlock.textContent.trim();
        if (text.startsWith('flowchart') || text.startsWith('graph') || text.startsWith('sequenceDiagram') || text.startsWith('stateDiagram') || text.startsWith('erDiagram')) {
          const pre = codeBlock.closest('pre');
          const wrapper = document.createElement('div');
          wrapper.className = 'mermaid-wrapper';
          wrapper.innerHTML = `<div class="mermaid">${text}</div>`;
          pre.replaceWith(wrapper);
        }
      });

      // Highlight non-mermaid code blocks
      renderElem.querySelectorAll('pre code').forEach((el) => {
        hljs.highlightElement(el);
      });

      // Render Mermaid Diagrams
      try {
        await mermaid.run({
          querySelector: '.mermaid'
        });
      } catch (err) {
        console.error('Mermaid rendering error:', err);
      }

      // Build Table of Contents
      buildTOC();

      // Scroll to top
      document.getElementById('markdownContainer').scrollTop = 0;

      // Update Sidebar Active state
      renderSidebar(document.getElementById('searchInput').value);
    }

    // Generate Table of Contents
    function buildTOC() {
      const tocList = document.getElementById('tocList');
      tocList.innerHTML = '';
      
      const headings = document.querySelectorAll('#markdownRender h2, #markdownRender h3');
      headings.forEach((heading, idx) => {
        const id = `heading-${idx}`;
        heading.id = id;

        const li = document.createElement('li');
        li.className = `toc-item depth-${heading.tagName === 'H2' ? '2' : '3'}`;
        li.innerHTML = `<a href="#${id}">${heading.innerText}</a>`;
        tocList.appendChild(li);
      });
    }

    // Event Listeners
    document.getElementById('searchInput').oninput = (e) => {
      renderSidebar(e.target.value);
    };

    document.getElementById('themeToggle').onclick = () => {
      const body = document.body;
      const currentTheme = body.getAttribute('data-theme');
      const newTheme = currentTheme === 'light' ? 'dark' : 'light';
      body.setAttribute('data-theme', newTheme);
      document.getElementById('themeToggle').textContent = newTheme === 'light' ? '☀️' : '🌙';
      
      mermaid.initialize({
        theme: newTheme === 'light' ? 'default' : 'dark',
        fontSize: 14
      });
      loadDocument(currentDocKey);
    };

    // Modal Raw View
    const modal = document.getElementById('rawModal');
    document.getElementById('rawViewBtn').onclick = () => {
      document.getElementById('modalTitle').textContent = `Raw: ${currentDocKey}`;
      document.getElementById('rawTextarea').value = docsData[currentDocKey] || '';
      modal.style.display = 'flex';
    };
    document.getElementById('closeModal').onclick = () => {
      modal.style.display = 'none';
    };

    // Initial Load
    renderSidebar();
    loadDocument(currentDocKey);
  </script>
</body>
</html>
